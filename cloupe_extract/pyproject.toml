[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cloupe_extract"
version = "0.2.0"
description = "Shared .cloupe extraction core underlying loupe2py (Python/AnnData) and Loupe2R (R/Seurat)"
readme = "README.md"
requires-python = ">=3.9"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE", "THIRD_PARTY_LICENSES/*"]
authors = [
    { name = "Niel Infante", email = "nielinfante@gmail.com" },
]
classifiers = [
    "License :: OSI Approved :: GNU Affero General Public License v3 or later (AGPLv3+)",
]
dependencies = [
    "numpy",
    "scipy",
    "pillow",
]

[project.optional-dependencies]
test = [
    "pytest",
]

[project.urls]
Homepage = "https://github.com/niel-infante/Loupe2Py"
Issues = "https://github.com/niel-infante/Loupe2Py/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/cloupe_extract"]
