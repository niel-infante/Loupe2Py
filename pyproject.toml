[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "loupe2py"
version = "0.1.1"
description = "Import 10x Genomics .cloupe files (including Visium HD) into squidpy-ready AnnData objects"
readme = "README.md"
requires-python = ">=3.9"
authors = [
    { name = "Niel Infante", email = "nielinfante@gmail.com" },
]
dependencies = [
    "anndata",
    "numpy",
    "scipy",
    "pandas",
    "pillow",
]

[project.optional-dependencies]
test = [
    "pytest",
    "squidpy",
    "pyarrow",
]

[project.urls]
Homepage = "https://github.com/niel-infante/Loupe2Py"
Issues = "https://github.com/niel-infante/Loupe2Py/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/loupe2py"]
